<!doctype html>
<html lang="en-AU">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Page not found | The Signage Shed</title>
    <script>
      // GitHub Pages serves this file for any address it doesn't have. The site's pages live at
      // hash routes (/#/refund-policy), so send clean links like /refund-policy there instead.
      (function () {
        var pages = ["refund-policy", "privacy-policy", "terms", "media-walls", "table-covers", "quote-thanks"];
        var path = location.pathname.replace(/\/+$/, "");
        var slug = path.slice(path.lastIndexOf("/") + 1).toLowerCase();
        if (pages.indexOf(slug) !== -1) {
          location.replace(path.slice(0, path.lastIndexOf("/") + 1) + "#/" + slug);
        }
      })();
    </script>
    <style>
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #FAF6EE; color: #33373A; font-family: Georgia, serif; text-align: center; padding: 1rem; }
      a { color: #A2461F; font-weight: bold; }
    </style>
  </head>
  <body>
    <main>
      <h1>Page not found</h1>
      <p>That page doesn't exist. <a href="/">Go to The Signage Shed home page</a>.</p>
    </main>
  </body>
</html>
